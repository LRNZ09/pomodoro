name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * *" # daily: a Claude Code release can break the plugin with no change here
  workflow_dispatch:

permissions:
  contents: read

# The plugin against the oldest Claude Code it supports and the newest. No login needed.
jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        claude: ["2.1.304", latest]
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude }}
      - run: bun install --frozen-lockfile
      - run: bun run build # the plugin loads core from the copy this makes
      - run: bun run check
      - name: Write the plugin API types
        # Loading the plugin from this folder writes them, even logged out; the run then stops at sign-in.
        run: CLAUDE_CODE_PLUGIN_DIR_WATCH=1 claude -p --plugin-dir packages/claude /cost || true
      - name: Check this Claude Code wrote them
        run: |
          head -1 packages/claude/.claude-plugin/types/claude-code/index.d.ts
          grep -qF "Written by Claude Code $(claude --version | cut -d' ' -f1)." packages/claude/.claude-plugin/types/claude-code/index.d.ts
      - run: claude plugin validate packages/claude
      - run: claude plugin validate .
      - run: bun run test
      - run: bun run typecheck

  # The Pi extension against the newest Pi; the plugin job checks the Pi it's built on. A Pi release can break it with
  # no change here, and the extension swallows its own errors, so a break would only show as check-ins stopping.
  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Use the newest Pi
        # An exact version, since Bun keeps the lockfile's for a tag like latest.
        run: |
          v=$(npm view @earendil-works/pi-coding-agent version)
          sed -i "s#\"@earendil-works/pi-coding-agent\": \"[0-9.]*\"#\"@earendil-works/pi-coding-agent\": \"$v\"#" packages/pi/package.json
          bun install
          echo "Pi $v"
      - run: bun run build
      - run: bunx tsc -p packages/pi
      - run: bun scripts/pi-smoke.ts

  # Publishes each package whose version isn't on npm yet, through npm trusted publishing: no token.
  publish:
    needs: plugin
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx changeset publish # prepack copies core into the plugin
