schema_version: "1.1"
name: check-in
description: With the check-in due, Claude pauses mid-task, sums up and asks whether to go on.
runs: 3
execution:
  prompt: |
    Write a random 6-digit number to step1.txt in this folder. Then, one file at a time: read the
    previous file with the Read tool and write the next one (step2.txt, step3.txt, up to step5.txt)
    holding that number plus 1. Then tell me you're done.
  max_turns: 20
  allowed_tools: [Read, Write]
  env:
    # Makes one check-in due at once: the eval runs headless, where the plugin's clock never starts.
    EVAL_POMODORO_CHECK_IN_DUE: "1"
graders:
  - name: paused
    type: file_exists
    path: step5.txt
    exists: false
  - name: checked-in
    type: llm
    focus: last_message
    criteria: >-
      The message stops before all five files are written, sums up in at most three short lines
      what was done, whether it still serves the original goal, and what would come next, and
      asks whether to go on, change course or stop.
